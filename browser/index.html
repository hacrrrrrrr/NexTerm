<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexTerm</title><style>body{margin:0;background:#090b10;color:#ddd;font-family:monospace}#bar{padding:10px;background:#11141c}#term{padding:12px;white-space:pre-wrap;height:calc(100vh - 55px);overflow:auto}input{background:#090b10;color:#ddd;border:0;outline:0;width:80%;font:inherit}</style></head><body><div id="bar">NexTerm Browser · <input id="url" placeholder="WebSocket URL"></div><div id="term"></div><script>const term=document.getElementById('term'),input=document.getElementById('url');let ws;function print(s){term.textContent+=s;term.scrollTop=term.scrollHeight}input.addEventListener('keydown',e=>{if(e.key==='Enter'){ws=new WebSocket(input.value);ws.onmessage=x=>print(x.data);ws.onopen=()=>print('[connected]\n');ws.onclose=()=>print('\n[closed]\n')}});document.addEventListener('keydown',e=>{if(ws?.readyState===1&&e.target!==input){e.preventDefault();ws.send(JSON.stringify({type:'input',data:e.key==='Enter'?'\r':e.key==='Backspace'?'\x7f':e.key}))}});</script></body></html>
