openapi: 3.0.3
info:
  title: NexTerm API
  version: 0.3.0
  description: Public contract for NexTerm clients and gateways.
servers:
  - url: https://api.nexterm.github.io
paths:
  /health:
    get:
      summary: Service health
      responses:
        "200":
          description: Healthy
  /capabilities:
    get:
      summary: Discover NexTerm capabilities
      responses:
        "200":
          description: Capability document
  /sessions:
    get:
      summary: List sessions visible to the authenticated client
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Session list}
    post:
      summary: Create a PTY session
      security: [{bearerAuth: []}]
      responses:
        "201": {description: Session created}
  /sessions/{id}:
    delete:
      summary: Close a PTY session
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "204": {description: Session removed}
        "404": {description: Session not found}
  /packages:
    get:
      summary: Get package index
      responses:
        "200": {description: Package index}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
